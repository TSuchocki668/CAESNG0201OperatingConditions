<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Six Operating Conditions</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; font-family: Georgia, serif; background: #fff; }
  svg { display: block; margin: 0 auto; max-width: 680px; width: 100%; cursor: default; }
  text { font-family: Georgia, serif; }
  .node { cursor: pointer; }
  .node rect, .node text { pointer-events: all; }
  .node:hover rect { filter: brightness(0.93); }

  #panel {
    display: none;
    max-width: 680px;
    margin: 16px auto 0;
    border-radius: 12px;
    padding: 20px 24px;
    font-size: 14px;
    line-height: 1.7;
    color: #1a1a1a;
    position: relative;
    border: 1.5px solid #ccc;
    background: #fafafa;
    animation: fadeIn 0.2s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  #panel h2 { margin: 0 0 6px; font-size: 17px; }
  #panel p { margin: 0; }
  #panel .label { font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 4px; font-family: sans-serif; font-weight: 600; }
  #close-btn {
    position: absolute; top: 12px; right: 16px;
    background: none; border: none; font-size: 20px; cursor: pointer;
    color: #888; line-height: 1;
  }
  #close-btn:hover { color: #333; }
</style>
</head>
<body>

<svg viewBox="0 0 680 530" xmlns="http://www.w3.org/2000/svg" id="diagram">
  <defs>
    <clipPath id="earthClip">
      <circle cx="340" cy="283" r="68"/>
    </clipPath>
    <radialGradient id="atmGrad" cx="50%" cy="50%" r="50%">
      <stop offset="82%" stop-color="transparent"/>
      <stop offset="100%" stop-color="#a8d8f0" stop-opacity="0.45"/>
    </radialGradient>
  </defs>

  <!-- Title -->
  <text x="340" y="36" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a" letter-spacing="0.3">The Six Operating Conditions</text>
  <text x="340" y="56" text-anchor="middle" font-size="12" fill="#555">Earth's integrated system for life — click any condition to explore</text>

  <!-- Hexagon ring -->
  <line x1="340" y1="118" x2="490" y2="200" stroke="#bbb" stroke-width="1"/>
  <line x1="490" y1="200" x2="490" y2="358" stroke="#bbb" stroke-width="1"/>
  <line x1="490" y1="358" x2="340" y2="440" stroke="#bbb" stroke-width="1"/>
  <line x1="340" y1="440" x2="190" y2="358" stroke="#bbb" stroke-width="1"/>
  <line x1="190" y1="358" x2="190" y2="200" stroke="#bbb" stroke-width="1"/>
  <line x1="190" y1="200" x2="340" y2="118" stroke="#bbb" stroke-width="1"/>

  <!-- Diagonal spokes -->
  <line x1="340" y1="118" x2="340" y2="440" stroke="#ddd" stroke-width="0.8"/>
  <line x1="490" y1="200" x2="190" y2="358" stroke="#ddd" stroke-width="0.8"/>
  <line x1="490" y1="358" x2="190" y2="200" stroke="#ddd" stroke-width="0.8"/>

  <!-- Earth image from GitHub -->
  <image
    href="https://cdn.jsdelivr.net/gh/conceptualacademy/conceptualacademy.github.io@main/images/EarthFullNASA.png"
    x="272" y="215" width="136" height="136"
    clip-path="url(#earthClip)"
    preserveAspectRatio="xMidYMid slice"/>

  <!-- Atmosphere glow ring -->
  <circle cx="340" cy="283" r="68" fill="url(#atmGrad)"/>
  <!-- Outer border ring -->
  <circle cx="340" cy="283" r="68" fill="none" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- SUNLIGHT (top) -->
  <g class="node" data-id="sunlight">
    <rect x="272" y="90" width="136" height="56" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <text x="340" y="114" text-anchor="middle" font-size="14" font-weight="700" fill="#92400E">Sunlight</text>
    <text x="340" y="132" text-anchor="middle" font-size="11" fill="#B45309">energy input</text>
  </g>

  <!-- WATER (upper right) -->
  <g class="node" data-id="water">
    <rect x="422" y="172" width="136" height="56" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
    <text x="490" y="196" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A8A">Water</text>
    <text x="490" y="214" text-anchor="middle" font-size="11" fill="#1D4ED8">universal solvent</text>
  </g>

  <!-- CYCLES (lower right) -->
  <g class="node" data-id="cycles">
    <rect x="422" y="330" width="136" height="56" rx="10" fill="#CCFBF1" stroke="#0D9488" stroke-width="1.5"/>
    <text x="490" y="354" text-anchor="middle" font-size="14" font-weight="700" fill="#134E4A">Cycles</text>
    <text x="490" y="372" text-anchor="middle" font-size="11" fill="#0F766E">matter returns</text>
  </g>

  <!-- DYNAMIC NON-EQUILIBRIUM (bottom) -->
  <g class="node" data-id="dynamic">
    <rect x="248" y="410" width="184" height="60" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="340" y="433" text-anchor="middle" font-size="14" font-weight="700" fill="#4C1D95">Dynamic</text>
    <text x="340" y="450" text-anchor="middle" font-size="14" font-weight="700" fill="#4C1D95">non-equilibrium</text>
    <text x="340" y="464" text-anchor="middle" font-size="11" fill="#6D28D9">constant change</text>
  </g>

  <!-- LIMITS (lower left) -->
  <g class="node" data-id="limits">
    <rect x="122" y="330" width="136" height="56" rx="10" fill="#FFE4E6" stroke="#E11D48" stroke-width="1.5"/>
    <text x="190" y="354" text-anchor="middle" font-size="14" font-weight="700" fill="#881337">Limits</text>
    <text x="190" y="372" text-anchor="middle" font-size="11" fill="#BE123C">finite resources</text>
  </g>

  <!-- GRAVITY (upper left) -->
  <g class="node" data-id="gravity">
    <rect x="122" y="172" width="136" height="56" rx="10" fill="#F1F5F9" stroke="#475569" stroke-width="1.5"/>
    <text x="190" y="196" text-anchor="middle" font-size="14" font-weight="700" fill="#1E293B">Gravity</text>
    <text x="190" y="214" text-anchor="middle" font-size="11" fill="#475569">structuring force</text>
  </g>

  <!-- Footer -->
  <text x="340" y="510" text-anchor="middle" font-size="10" fill="#999">Environmental Science through Nature's Genius</text>
</svg>

<div id="panel">
  <button id="close-btn" onclick="closePanel()">×</button>
  <div class="label" id="panel-label"></div>
  <h2 id="panel-title"></h2>
  <p id="panel-body"></p>
</div>

<script>
const data = {
  sunlight: {
    label: "Energy Input",
    title: "Sunlight",
    color: "#92400E",
    border: "#D97706",
    bg: "#FFFBEB",
    body: "Nearly all energy flowing through Earth's living systems begins as sunlight. Photosynthesis captures that solar energy and locks it into chemical bonds — the same energy a caterpillar accesses when it chews a leaf, and the same energy released when a fire burns through a forest. Organisms from Arctic poppies to deep-sea bacteria have refined strategies for capturing, concentrating, and channeling light energy across billions of years of evolution."
  },
  water: {
    label: "Universal Solvent",
    title: "Water",
    color: "#1E3A8A",
    border: "#2563EB",
    bg: "#EFF6FF",
    body: "Water is the medium in which virtually every biochemical reaction takes place. Its unique molecular properties — hydrogen bonding, remarkable surface tension, high specific heat — make it irreplaceable for life as we know it. From the kangaroo rat that extracts water from dry seeds through metabolic chemistry, to the fog-harvesting Namib beetle, organisms across Earth's driest environments demonstrate just how precisely life works within water's possibilities and constraints."
  },
  cycles: {
    label: "Matter Returns",
    title: "Cyclic Processes",
    color: "#134E4A",
    border: "#0D9488",
    bg: "#F0FDFA",
    body: "Matter on Earth cycles endlessly — carbon, nitrogen, phosphorus, and water move through living organisms, soils, atmosphere, and oceans in continuous loops. Nothing is wasted; everything is borrowed and returned. The carbon atoms in the breath you just exhaled have passed through ancient forests, ocean creatures, and soil microbes across billions of years. Life does not consume resources — it participates in their circulation."
  },
  dynamic: {
    label: "Constant Change",
    title: "Dynamic Non-Equilibrium",
    color: "#4C1D95",
    border: "#7C3AED",
    bg: "#F5F3FF",
    body: "Earth's living systems are never truly still. Populations fluctuate, climates shift, fire moves through forests, floods reshape rivers, species come and go. Stability in nature is not stasis — it is dynamic balance, maintained through continuous adjustment and response. Life does not resist change; it is shaped by change and thrives by responding to it. The most resilient organisms and ecosystems are not the most rigid, but the most adaptive."
  },
  limits: {
    label: "Finite Resources",
    title: "Limits and Boundaries",
    color: "#881337",
    border: "#E11D48",
    bg: "#FFF1F2",
    body: "Every ecosystem operates within boundaries. Territory, nutrients, sunlight, and water are finite. Organisms that thrive work within these limits, often turning scarcity into advantage. Coral reefs grow in nutrient-poor water yet support 25% of all marine species through nearly perfect recycling. Limits are the conditions that drove life's ingenuity."
  },
  gravity: {
    label: "Structuring Force",
    title: "Gravity",
    color: "#1E293B",
    border: "#475569",
    bg: "#F8FAFC",
    body: "Gravity shapes every structure on Earth: how organisms are built, how they move, how they solve fundamental engineering challenges. A redwood distributes tons of weight through a circular cross-section and composite wood tissue refined over millions of years. Bamboo achieves towering height through hollow, segmented stems that flex without breaking. In water, 800 times denser than air, pressure increases rapidly with depth, shaping the bodies of deep-sea creatures entirely. Gravity is the constant that shaped how life is built."
  }
};

document.querySelectorAll('.node').forEach(node => {
  node.addEventListener('click', () => {
    const id = node.getAttribute('data-id');
    const d = data[id];
    const panel = document.getElementById('panel');
    document.getElementById('panel-label').textContent = d.label;
    document.getElementById('panel-title').textContent = d.title;
    document.getElementById('panel-body').textContent = d.body;
    panel.style.display = 'block';
    panel.style.borderColor = d.border;
    panel.style.background = d.bg;
    document.getElementById('panel-title').style.color = d.color;
    document.getElementById('panel-label').style.color = d.border;
    panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  });
});

function closePanel() {
  document.getElementById('panel').style.display = 'none';
}
</script>
</body>
</html>
