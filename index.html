<title>The Six Operating Conditions</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; font-family: Georgia, serif; background: #fff; }
  svg { display: block; margin: 0 auto; max-width: 680px; width: 100%; cursor: default; }
  text { font-family: Georgia, serif; }
  .node { cursor: pointer; }
  .node rect, .node text { pointer-events: all; }
  .node:hover rect { filter: brightness(0.93); }

  /* Info panel */
  #panel {
    display: none;
    max-width: 680px;
    margin: 16px auto 0;
    border-radius: 12px;
    padding: 20px 24px;
    font-size: 14px;
    line-height: 1.7;
    color: #1a1a1a;
    position: relative;
    border: 1.5px solid #ccc;
    background: #fafafa;
    animation: fadeIn 0.2s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  #panel h2 { margin: 0 0 6px; font-size: 17px; }
  #panel p { margin: 0; }
  #panel .label { font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 4px; font-family: sans-serif; font-weight: 600; }
  #close-btn {
    position: absolute; top: 12px; right: 16px;
    background: none; border: none; font-size: 20px; cursor: pointer;
    color: #888; line-height: 1;
  }
  #close-btn:hover { color: #333; }
</style>

<!-- Info panel -->
<div id="panel">
  <button id="close-btn" onclick="closePanel()">×</button>
  <div class="label" id="panel-label"></div>
  <h2 id="panel-title"></h2>
  <p id="panel-body"></p>
</div>

<script>
const data = {
  sunlight: {
    label: "Energy Input",
    title: "Sunlight",
    color: "#92400E",
    border: "#D97706",
    bg: "#FFFBEB",
    body: "Nearly all energy flowing through Earth's living systems begins as sunlight. Photosynthesis captures that solar energy and locks it into chemical bonds — the same energy a caterpillar accesses when it chews a leaf, and the same energy released when a fire burns through a forest. Organisms from Arctic poppies to deep-sea bacteria have refined strategies for capturing, concentrating, and channeling light energy across billions of years of evolution."
  },
  water: {
    label: "Universal Solvent",
    title: "Water",
    color: "#1E3A8A",
    border: "#2563EB",
    bg: "#EFF6FF",
    body: "Water is the medium in which virtually every biochemical reaction takes place. Its unique molecular properties — hydrogen bonding, remarkable surface tension, high specific heat — make it irreplaceable for life as we know it. From the kangaroo rat that extracts water from dry seeds through metabolic chemistry, to the fog-harvesting Namib beetle, organisms across Earth's driest environments demonstrate just how precisely life works within water's possibilities and constraints."
  },
  cycles: {
    label: "Matter Returns",
    title: "Cyclic Processes",
    color: "#134E4A",
    border: "#0D9488",
    bg: "#F0FDFA",
    body: "Matter on Earth cycles endlessly — carbon, nitrogen, phosphorus, and water move through living organisms, soils, atmosphere, and oceans in continuous loops. Nothing is wasted; everything is borrowed and returned. The carbon atoms in the breath you just exhaled have passed through ancient forests, ocean creatures, and soil microbes across billions of years. Life does not consume resources — it participates in their circulation."
  },
  dynamic: {
    label: "Constant Change",
    title: "Dynamic Non-Equilibrium",
    color: "#4C1D95",
    border: "#7C3AED",
    bg: "#F5F3FF",
    body: "Earth's living systems are never truly still. Populations fluctuate, climates shift, fire moves through forests, floods reshape rivers, species come and go. Stability in nature is not stasis — it is dynamic balance, maintained through continuous adjustment and response. Life does not resist change; it is shaped by change and thrives by responding to it. The most resilient organisms and ecosystems are not the most rigid, but the most adaptive."
  },
  limits: {
    label: "Finite Resources",
    title: "Limits and Boundaries",
    color: "#881337",
    border: "#E11D48",
    bg: "#FFF1F2",
    body: "Every ecosystem operates within boundaries. Territory, nutrients, sunlight, and water are finite. Organisms that thrive work within these limits, often turning scarcity into advantage. Coral reefs grow in nutrient-poor water yet support 25% of all marine species through nearly perfect recycling. Limits are the conditions that drove life's ingenuity."
  },
  gravity: {
    label: "Structuring Force",
    title: "Gravity",
    color: "#1E293B",
    border: "#475569",
    bg: "#F8FAFC",
    body: "Gravity shapes every structure on Earth: how organisms are built, how they move, how they solve fundamental engineering challenges. A redwood distributes tons of weight through a circular cross-section and composite wood tissue refined over millions of years. Bamboo achieves towering height through hollow, segmented stems that flex without breaking. In water, 800 times denser than air, pressure increases rapidly with depth, shaping the bodies of deep-sea creatures entirely. Gravity is the constant that shaped how life is built."
  }
};

document.querySelectorAll('.node').forEach(node => {
  node.addEventListener('click', () => {
    const id = node.getAttribute('data-id');
    const d = data[id];
    const panel = document.getElementById('panel');
    document.getElementById('panel-label').textContent = d.label;
    document.getElementById('panel-title').textContent = d.title;
    document.getElementById('panel-body').textContent = d.body;
    panel.style.display = 'block';
    panel.style.borderColor = d.border;
    panel.style.background = d.bg;
    document.getElementById('panel-title').style.color = d.color;
    document.getElementById('panel-label').style.color = d.border;
    panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  });
});

function closePanel() {
  document.getElementById('panel').style.display = 'none';
}
</script>
